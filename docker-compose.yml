services:
  # FastAPI app
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./greenometer_data_pipeline/src/data:/app/greenometer_data_pipeline/src/data
      - ./greenometer_data_pipeline/src/output:/app/greenometer_data_pipeline/src/output
    environment:
      - AIRFLOW_API_URL=http://airflow-webserver:8080/api/v1
      - AIRFLOW_USERNAME=admin
      - AIRFLOW_PASSWORD=admin
      - DATA_DIR=/app/greenometer_data_pipeline/src/data
      - OUTPUT_DIR=/app/greenometer_data_pipeline/src/output
    networks:
      - data-pipeline-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow init
  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: >
      bash -c "airflow db init &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - DATA_DIR=/app/greenometer_data_pipeline/src/data
      - OUTPUT_DIR=/app/greenometer_data_pipeline/src/output
    volumes:
      - airflow-db-volume:/opt/airflow
      - ./greenometer_data_pipeline/src/airflow/dags:/opt/airflow/dags
      - ./greenometer_data_pipeline/src/data:/app/greenometer_data_pipeline/src/data
      - ./greenometer_data_pipeline/src/output:/app/greenometer_data_pipeline/src/output
      - ./greenometer_data_pipeline:/opt/airflow/greenometer_data_pipeline
    networks:
      - data-pipeline-network

  # Airflow webserver
  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    ports:
      - "8080:8080"
    command: webserver
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - DATA_DIR=/app/greenometer_data_pipeline/src/data
      - OUTPUT_DIR=/app/greenometer_data_pipeline/src/output
    volumes:
      - airflow-db-volume:/opt/airflow
      - ./greenometer_data_pipeline/src/airflow/dags:/opt/airflow/dags
      - ./greenometer_data_pipeline/src/data:/app/greenometer_data_pipeline/src/data
      - ./greenometer_data_pipeline/src/output:/app/greenometer_data_pipeline/src/output
      - ./greenometer_data_pipeline:/opt/airflow/greenometer_data_pipeline
    networks:
      - data-pipeline-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow scheduler
  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    command: scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__SQL_ALCHEMY_CONN=sqlite:////opt/airflow/airflow.db
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - DATA_DIR=/app/greenometer_data_pipeline/src/data
      - OUTPUT_DIR=/app/greenometer_data_pipeline/src/output
    volumes:
      - airflow-db-volume:/opt/airflow
      - ./greenometer_data_pipeline/src/airflow/dags:/opt/airflow/dags
      - ./greenometer_data_pipeline/src/data:/app/greenometer_data_pipeline/src/data
      - ./greenometer_data_pipeline/src/output:/app/greenometer_data_pipeline/src/output
      - ./greenometer_data_pipeline:/opt/airflow/greenometer_data_pipeline
    networks:
      - data-pipeline-network
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_started

volumes:
  airflow-db-volume:

networks:
  data-pipeline-network:
    driver: bridge